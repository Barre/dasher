[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dasher"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "attrs",
    "toolz",
    "xxhash",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dasher"]

[dependency-groups]
dev = [
    "duckdb>=1.5.0",
    "ipython>=8.10.0",
    "xorq",
]
